directory:
  project: '../demos/snuh_blue'
  det_model: '../models/detection_model'
  pose_model: '../models/pose_model'
  dae_model: '../models/dae_model'

animal:
  n_tracks: 2
  dye_identity: true
  dye_color_identity: false
  dye_hue_range: [140, 175]
  dye_sat_min: 60
  dye_val_min: 50
  dye_min_pixels: 120
  dye_track: 1               # the pink animal owns track2   # animals are white + PINK; detector only knows white/blue
  bodyparts: ['head', 'leftear', 'rightear', 'neck',
              'leftelbow', 'rightelbow', 'lefthand', 'righthand',
              'spinemid', 'tailbase', 'leftknee', 'rightknee',
              'leftfoot', 'rightfoot', 'tailmid', 'tailend']
  skip: []

calibration:
  n_cameras: 5
  board_type: 'charuco'
  board_size: [10, 7]              # SQUARES (=> 9x6 interior corners)
  board_square_side_length: 25      # mm  PLACEHOLDER - needs the real value
  board_marker_length: 18.75        # mm  PLACEHOLDER (0.75 x square)
  marker_bits: 4
  dict_size: 50
  fisheye: false

visualization:
  track_cmap: 'Set2'
  skeleton_cmap: 'hls'
  skeleton:
    - ['head', 'leftear', 'neck', 'rightear', 'head']
    - ['neck', 'spinemid', 'tailbase']

threshold:
  bbox: 0.2
  iou: 0.8
  keypoint: 0.5

triangulation:
  user_define_axes: false
  dae_enable: false

optimization:
  do_optimize: false
  n_deriv_smooth: 2
  scale_smooth: 2
  scale_length: 2
  scale_length_weak: 1
  bodypart_distance:
    'head - rightear': 21.0
  bodypart_distance_weak: {}
